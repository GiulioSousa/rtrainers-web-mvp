<div
  class="campo"
  [class.campo--preenchido]="preenchido()"
  [class.campo--senha]="tipo() === 'senha'"
  [class.campo--numerico]="numerico()"
  [class.campo--desabilitado]="desabilitado()">

  <!-- No numerico o rotulo sai da tela mas continua sendo o nome acessivel. -->
  <label class="campo__rotulo" [class.apenas-leitor]="numerico()" [attr.for]="id">{{ rotulo() }}</label>

  <div class="campo__caixa">
    <input
      #entrada
      [id]="id"
      [type]="tipoNativo()"
      [value]="valor()"
      [attr.placeholder]="numerico() ? null : rotulo()"
      [disabled]="desabilitado()"
      [attr.autocomplete]="autocomplete()"
      [attr.inputmode]="modoTecladoEfetivo()"
      [attr.maxlength]="numerico() ? 2 : null"
      (input)="aoDigitar($event)"
      (blur)="aoSair()" />

    @if (tipo() === 'senha') {
      <button
        type="button"
        class="campo__olho"
        (click)="alternarVisibilidadeSenha()"
        [attr.aria-label]="senhaVisivel() ? 'Ocultar senha' : 'Mostrar senha'"
        [attr.aria-pressed]="senhaVisivel()">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
          <path
            d="M1.8 12S5.6 5.8 12 5.8 22.2 12 22.2 12 18.4 18.2 12 18.2 1.8 12 1.8 12Z"
            fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" />
          <circle cx="12" cy="12" r="3.1" fill="none" stroke="currentColor" stroke-width="1.8" />
          @if (senhaVisivel()) {
            <line x1="4" y1="20" x2="20" y2="4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
          }
        </svg>
      </button>
    }
  </div>
</div>
