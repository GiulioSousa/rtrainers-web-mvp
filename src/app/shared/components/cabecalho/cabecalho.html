<header class="cabecalho">
  <div class="cabecalho__inicio">
    @if (rotaVoltar(); as rota) {
      <a class="cabecalho__voltar" [routerLink]="rota" aria-label="Voltar">
        <!-- arrow_back, Material Symbols -->
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
          <path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z" fill="currentColor" />
        </svg>
      </a>
    }

    <img
      class="cabecalho__marca"
      src="logo-wordmark.svg"
      alt="R Trainers"
      width="134"
      height="32" />
  </div>

  <span class="cabecalho__professor">{{ nomeProfessor() }}</span>
</header>
